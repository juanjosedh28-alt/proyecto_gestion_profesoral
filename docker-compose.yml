services:
  # --- SQL Server 2022: el motor de base de datos ---
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestion-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Aplicacionweb123!
    ports:
      - "11472:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # --- Inicializador: crea la base y corre el script UNA vez ---
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestion-sqlserver-init
    restart: "no"
    environment:
      - MSSQL_SA_PASSWORD=Aplicacionweb123!
    volumes:
      - ./db:/scripts:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init.sh"]

  # --- La API: C# / ASP.NET Core ---
  api-gestion:
    build: ./api_gestion
    container_name: gestion-api
    restart: unless-stopped
    ports:
      - "8074:8074"
    volumes:
      - ./api_gestion:/app
      - /app/bin
      - /app/obj
    environment:
      - ConnectionStrings__SqlServer=Server=sqlserver,1433;Database=gestion_local;User Id=sa;Password=Aplicacionweb123!;TrustServerCertificate=True;
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully

volumes:
  mssqldata: